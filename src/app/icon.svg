<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.2" result="edge"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="edge" operator="in" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation="2" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="rim"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#000"/>
  <circle cx="32" cy="34" r="30" fill="url(#halo)"/>
  <g filter="url(#glow)">
    <g stroke="#000" stroke-width="3.6" stroke-linecap="round">
      <line x1="32" y1="15" x2="18" y2="34"/>
      <line x1="32" y1="15" x2="46" y2="34"/>
      <line x1="18" y1="34" x2="12" y2="49"/>
      <line x1="18" y1="34" x2="25" y2="49"/>
      <line x1="46" y1="34" x2="52" y2="49"/>
    </g>
    <g fill="#000">
      <circle cx="32" cy="15" r="7"/>
      <circle cx="18" cy="34" r="5.5"/>
      <circle cx="46" cy="34" r="5.5"/>
      <circle cx="12" cy="49" r="4.3"/>
      <circle cx="25" cy="49" r="4.3"/>
      <circle cx="52" cy="49" r="4.3"/>
    </g>
  </g>
</svg>
